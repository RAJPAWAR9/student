<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JioSaavn Web Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding-bottom: 100px;
        }

        header {
            background-color: #1f1f1f;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            color: #1ed760;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        .search-container {
            display: flex;
            justify-content: center;
            max-width: 500px;
            margin: 0 auto;
        }

        input[type="text"] {
            width: 75%;
            padding: 12px;
            border: none;
            border-radius: 25px 0 0 25px;
            outline: none;
            font-size: 1rem;
            background: #2b2b2b;
            color: #fff;
            padding-left: 20px;
        }

        button {
            width: 25%;
            padding: 12px;
            border: none;
            background-color: #1ed760;
            color: #000;
            font-weight: bold;
            border-radius: 0 25px 25px 0;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        button:hover {
            background-color: #17b850;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .status {
            text-align: center;
            font-size: 1.2rem;
            color: #b3b3b3;
            margin-top: 40px;
        }

        .song-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .song-card {
            background-color: #181818;
            padding: 15px;
            border-radius: 10px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .song-card:hover {
            background-color: #282828;
            transform: translateY(-5px);
        }

        .song-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .song-title {
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }

        .song-artist {
            font-size: 0.85rem;
            color: #b3b3b3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 12px;
        }

        .play-btn {
            background-color: #1ed760;
            color: #000;
            border: none;
            padding: 8px;
            border-radius: 20px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
        }

        /* Bottom Fixed Player */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #181818;
            border-top: 1px solid #282828;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
            display: none; /* Initially Hidden */
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 30%;
        }

        .player-info img {
            width: 50px;
            height: 50px;
            border-radius: 6px;
        }

        .player-text {
            overflow: hidden;
        }

        .player-title {
            font-size: 0.95rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist {
            font-size: 0.8rem;
            color: #b3b3b3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        audio {
            width: 60%;
            outline: none;
        }

        @media (max-width: 600px) {
            .player-bar {
                flex-direction: column;
                gap: 10px;
            }
            .player-info {
                width: 100%;
            }
            audio {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>JioSaavn Player</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search songs, artists..." onkeypress="handleKeyPress(event)">
            <button onclick="searchSongs()">Search</button>
        </div>
    </header>

    <div class="container">
        <div id="status" class="status">Koil bi gaana search karein!</div>
        <div id="songGrid" class="song-grid"></div>
    </div>

    <!-- Bottom Player -->
    <div class="player-bar" id="playerBar">
        <div class="player-info">
            <img id="playerImg" src="" alt="Album Art">
            <div class="player-text">
                <div class="player-title" id="playerTitle">Song Name</div>
                <div class="player-artist" id="playerArtist">Artist Name</div>
            </div>
        </div>
        <audio id="audioPlayer" controls autoplay></audio>
    </div>

    <script>
        const BASE_URL = 'https://jiosaavn-api.raj-pawar091206.workers.dev';

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchSongs();
            }
        }

        async function searchSongs() {
            const query = document.getElementById('searchInput').value.trim();
            const statusDiv = document.getElementById('status');
            const songGrid = document.getElementById('songGrid');

            if (!query) {
                alert('Gaane ka naam darj karein!');
                return;
            }

            statusDiv.innerText = 'Search chal rahi hai...';
            statusDiv.style.display = 'block';
            songGrid.innerHTML = '';

            try {
                const response = await fetch(`${BASE_URL}/api/search/songs?query=${encodeURIComponent(query)}`);
                const data = await response.json();

                const songs = data?.data?.results;

                if (!songs || songs.length === 0) {
                    statusDiv.innerText = 'Koi gaana nahi mila. Dusra naam search karein.';
                    return;
                }

                statusDiv.style.display = 'none';

                songs.forEach(song => {
                    // HTML Entities decode karne ke liye
                    const title = decodeHTMLEntities(song.name);
                    const artist = decodeHTMLEntities(song.primaryArtists || 'Unknown Artist');
                    const image = song.image[1]?.url || song.image[0]?.url || 'https://via.placeholder.com/150';
                    
                    // High quality audio file URL (320kbps or max available)
                    const audioUrl = song.downloadUrl[song.downloadUrl.length - 1]?.url;

                    const card = document.createElement('div');
                    card.className = 'song-card';
                    card.innerHTML = `
                        <div>
                            <img src="${image}" alt="${title}">
                            <div class="song-title" title="${title}">${title}</div>
                            <div class="song-artist" title="${artist}">${artist}</div>
                        </div>
                        <button class="play-btn" onclick="playSong('${title.replace(/'/g, "\\'")}', '${artist.replace(/'/g, "\\'")}', '${image}', '${audioUrl}')">Play</button>
                    `;

                    songGrid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                statusDiv.innerText = 'Data load me dikkat aayi. Kripya baad me koshish karein.';
            }
        }

        function playSong(title, artist, image, audioUrl) {
            const playerBar = document.getElementById('playerBar');
            const playerImg = document.getElementById('playerImg');
            const playerTitle = document.getElementById('playerTitle');
            const playerArtist = document.getElementById('playerArtist');
            const audioPlayer = document.getElementById('audioPlayer');

            playerTitle.innerText = title;
            playerArtist.innerText = artist;
            playerImg.src = image;
            audioPlayer.src = audioUrl;

            playerBar.style.display = 'flex';
            audioPlayer.play();
        }

        function decodeHTMLEntities(text) {
            const textArea = document.createElement('textarea');
            textArea.innerHTML = text;
            return textArea.value;
        }
    </script>
</body>
</html>
